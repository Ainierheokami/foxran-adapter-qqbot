# =================== 历史窗口 ===================
# 每次请求模型时带多少历史。超出时一次移出一批最旧的消息并重新定锚，
# 之后若干轮 system 之后的前缀保持不变，便于命中上游 Prompt 缓存。
history_window:
  max_context_tokens: 128000  # 单次请求的上下文总预算（system + 历史 + 本轮运行时上下文，按本地估算的 token 计），不是模型输出上限
  max_messages: 60            # 发送给模型的历史消息最多条数（工具调用与结果也算条数）
  debug_log: false            # 是否打印每次截断前后的条数与 token 明细

# =================== 历史压缩 ===================
# 移出历史窗口的消息在后台压进一份滚动摘要，写入之后每轮的运行时上下文；
# 只在有历史被移出时才生成，历史还完整时不调用模型。
history_compression:
  enabled: true     # 关闭后被移出的历史直接丢弃，也不再注入旧摘要
  max_chars: 800    # 摘要最大字数

# =================== Token 构成记录 ===================
# WebUI 聊天页「构成」面板的数据：每次模型请求里人设、规则、工具、记忆、历史各占多少 token。
token_breakdown:
  keep_per_session: 50   # 每个会话保留最近多少次请求（面板显示最近 20 次）
  retention_days: 30     # 超过这么多天的记录自动删除

# =================== 用户画像 ===================
user_persona:
  auto_generate: true              # 是否启用被动触发自动生成画像
  allowed_platforms: []            # 允许触发的平台列表，为空则所有平台均可触发 (e.g., ["qq", "wechat"])
  trigger_probability: 20          # 满足条件后每次对话结束触发分析的概率 (0~100)
  max_users_per_trigger: 3         # 每次触发最多分析的独立活跃用户数
  max_chars_per_user: 500          # 每个用户画像的最大字数
  min_new_user_messages: 10        # 上次分析后至少新增多少条有效用户发言才会触发
  min_interval_seconds: 600        # 同一会话两次分析至少间隔的秒数，热闹的群里防止频繁重分析；0 不限

# =================== task_op 任务监督者 ===================
task_supervisor:
  enabled: true                    # 是否启用会话任务断尾监督
  cooldown_seconds: 3              # 同一会话监督唤醒的最小间隔秒数
  max_wakeups_per_task: 3          # 单个任务最多自动监督唤醒次数
  max_consecutive_no_progress: 2   # 连续无进展次数上限，超过后自动标记阻塞
  idle_after_turn_only: true       # 仅在当前动作链结束且队列空闲时触发
