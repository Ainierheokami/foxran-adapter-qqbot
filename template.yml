# QQ 机器人开放平台（https://bot.q.qq.com/）
# 顶层字段是兼容旧版的 default 账户；也可以改用下方 accounts 多账户列表。
enabled: false
app_id: ""
app_secret: ""
# GROUP_MESSAGE_CREATE 中用于匹配正文 <@OpenID> 的机器人 OpenID。
bot_openid: ""
transport: "websocket" # websocket、webhook 或 both
webhook_path: "/qqbot/webhook"
api_base_url: "https://api.bot.qq.com"
token_url: "https://bots.qq.com/app/getAppAccessToken"
# GROUP_AND_C2C_EVENT (1<<25) + PUBLIC_GUILD_MESSAGES (1<<30)
intents: 1107296256
shards: 1
use_group_as_session: true
reconnect_initial_delay: 2.0
reconnect_max_delay: 30.0

